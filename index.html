"  sh.setFrozenRows(1);",
"}"].join('\n');
const DIARY_H=['Date','Meal','Food','Brand','Amount','Calories','Net Carbs (g)','Carbs (g)','Fiber (g)','Sugar (g)','Fat (g)','Sat Fat (g)','Protein (g)','Sodium (mg)','Cholesterol (mg)'];
const DAILY_H=['Date','Food Calories','Exercise Calories','Net Calories','Calorie Goal','Net Carbs (g)','Fat (g)','Protein (g)','Fiber (g)','Sugar (g)','Sodium (mg)','Water (oz)'];
function diaryRows(){const rows=[];Object.keys(S.diary).sort().forEach(k=>MEALS.forEach(m=>(S.diary[k][m]||[]).forEach(e=>{const n=nOf(e);rows.push([k,ML[m],e.food.name,e.food.brand||'',amountLabel(e),Math.round(n.cal),r1(Math.max(0,n.carb-n.fiber)),r1(n.carb),r1(n.fiber),r1(n.sugar),r1(n.fat),r1(n.sat),r1(n.pro),Math.round(n.sodium),Math.round(n.chol)])})));return rows}
function dailyRows(){return Object.keys(S.diary).sort().filter(k=>logged(k)||day(k).water||day(k).exercise.length).map(k=>{const n=dayN(k),ex=exCal(k);return [k,Math.round(n.cal),Math.round(ex),Math.round(n.cal-ex),S.settings.calGoal,r1(Math.max(0,n.carb-n.fiber)),r1(n.fat),r1(n.pro),r1(n.fiber),r1(n.sugar),Math.round(n.sodium),day(k).water||0]})}
function payload(){const st=clone(S);st.settings.sheetUrl='';st.settings.aiKey='';st.settings.nixId='';st.settings.nixKey='';return{diaryHeaders:DIARY_H,diary:diaryRows(),dailyHeaders:DAILY_H,daily:dailyRows(),weights:S.weights.map(w=>[w.date,w.lbs]),exercise:Object.keys(S.diary).sort().flatMap(k=>(S.diary[k].exercise||[]).map(x=>[k,x.name,x.min||'',x.cal])),state:st}}
let syncT;
function scheduleSync(){if(!S.settings.sheetUrl||!S.settings.autoSync)return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(false),2500)}
async function syncNow(manual){const url=S.settings.sheetUrl;if(!url){if(manual)toast('Paste your Google Sheet web app link first');return}
 try{await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload())});S.settings.lastSync=new Date().toISOString();persist();if(manual){toast('Synced to Google Sheet');render()}}
 catch(e){if(manual)toast('Sync failed — check the link and your connection')}}
async function restoreSheet(){const url=S.settings.sheetUrl;if(!url)return toast('Paste your Google Sheet web app link first');
 try{toast('Loading from Google Sheet…');const r=await fetch(url);const j=await r.json();if(!j||!j.diary)return toast('No backup found in that sheet yet');
  if(!confirm('Replace the data on this device with the copy from your Google Sheet?'))return;const keep=url,key=S.settings.aiKey,ni=S.settings.nixId,nk=S.settings.nixKey;S=normalize(j);S.settings.sheetUrl=keep;S.settings.aiKey=key;S.settings.nixId=ni;S.settings.nixKey=nk;persist();applyTheme();setTab('today');toast('Restored from Google Sheet')}
 catch(e){toast('Couldn’t load from the sheet — check the link')}}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportCSV(){download(`food-diary-${today()}.csv`,[DIARY_H,...diaryRows()].map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv');toast('Diary exported')}
function exportBackup(){const st=clone(S);st.settings.aiKey='';st.settings.nixId='';st.settings.nixKey='';download(`calorie-tracker-backup-${today()}.json`,JSON.stringify(st),'application/json')}
function importBackup(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.diary)throw 0;if(!confirm('Replace the data on this device with this backup?'))return;const keep=S.settings.sheetUrl,key=S.settings.aiKey,ni=S.settings.nixId,nk=S.settings.nixKey;S=normalize(j);if(!S.settings.sheetUrl)S.settings.sheetUrl=keep;S.settings.aiKey=key;S.settings.nixId=ni;S.settings.nixKey=nk;save();applyTheme();setTab('today');toast('Backup restored')}catch(e){toast('That file isn’t a tracker backup')}};r.readAsText(f)}
function copyScript(){const t=$('#scriptbox');t.select();try{navigator.clipboard.writeText(APPS_SCRIPT).then(()=>toast('Script copied'),()=>{document.execCommand('copy');toast('Script copied')})}catch(e){document.execCommand('copy');toast('Script copied')}}
function applyTheme(){document.documentElement.dataset.theme=S.settings.theme||'dark'}
V.settings=()=>{const s=S.settings;
 return `<div class="topbar"><button class="circ" onclick="back()">${IC.back}</button><div class="ttl">Settings</div><span style="width:46px"></span></div>
 <div class="card"><h3>Google Sheet sync</h3><p class="note">Every change copies your diary, daily totals, weight and exercise to your Google Sheet, plus a full backup you can restore on a new phone.</p>
  <label class="fld">Web app link<input id="sheetUrl" value="${esc(s.sheetUrl)}" placeholder="https://script.google.com/macros/s/…/exec" onchange="S.settings.sheetUrl=this.value.trim();save();toast('Link saved')"></label>
  <div class="toggle"><span>Sync automatically</span><button class="sw ${s.autoSync?'on':''}" onclick="S.settings.autoSync=!S.settings.autoSync;save();render()" aria-label="Auto sync"></button></div>
  <div class="btnrow"><button class="chip" onclick="syncNow(true)">Sync now</button><button class="chip" onclick="restoreSheet()">Restore from sheet</button></div>
  ${s.lastSync?`<p class="note">Last synced ${new Date(s.lastSync).toLocaleString()}</p>`:''}
  <div class="note"><b>One-time setup</b><ol><li>Create a new Google Sheet.</li><li>Open Extensions → Apps Script, delete what’s there, paste the script below and save.</li><li>Click Deploy → New deployment → type Web app. Set “Execute as” to Me and “Who has access” to Anyone, then Deploy and allow access.</li><li>Copy the web app link and paste it above.</li></ol></div>
  <textarea id="scriptbox" class="fld code" readonly style="width:100%;background:var(--track);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--text)">${esc(APPS_SCRIPT)}</textarea>
  <button class="ghost wide" onclick="copyScript()">Copy script</button></div>
 <div class="card"><h3>Import from MyFitnessPal</h3><p class="note">Select all 3 files from your MyFitnessPal export at once (Nutrition, Exercise and Measurement), or the .zip if you have it. MyFitnessPal exports daily meal totals rather than single foods, so each meal comes in as one entry. Importing again replaces earlier imported days instead of doubling them.</p>
  <label class="btn wide" style="text-align:center;cursor:pointer">Choose export files<input type="file" multiple style="display:none" onchange="importMFP(this)"></label></div>
 <div class="card"><h3>Meal scan</h3><p class="note">Meal scan sends your photo to Claude to estimate what’s on the plate. Create a key at platform.claude.com under Settings → API keys and paste it here. The key stays on this phone and each scan is billed to your API account.</p>
  <label class="fld">Claude API key<input type="password" autocomplete="off" value="${esc(s.aiKey)}" placeholder="sk-ant-…" onchange="S.settings.aiKey=this.value.trim();save();toast('Key saved')"></label>
  <label class="fld">Model<select onchange="S.settings.aiModel=this.value;save()"><option value="claude-sonnet-5-5" ${s.aiModel!=='claude-haiku-5-5'?'selected':''}>Sonnet 5.5 (more accurate)</option><option value="claude-haiku-5-5" ${s.aiModel==='claude-haiku-5-5'?'selected':''}>Haiku 5.5 (faster, cheaper)</option></select></label></div>
 <div class="card"><h3>Restaurant search (optional)</h3><p class="note">Adds restaurant and brand menu items (McDonald’s, Chick-fil-A and more) to your search results, with servings like “20 nuggets.” Sign up free at developer.nutritionix.com, create an app, and paste its App ID and App Key here. The free plan has a low daily limit, so each opened item counts as a request. The keys stay on this phone.</p>
  <label class="fld">Nutritionix App ID<input value="${esc(s.nixId)}" autocomplete="off" onchange="S.settings.nixId=this.value.trim();save();toast('Saved')"></label>
  <label class="fld">Nutritionix App Key<input type="password" autocomplete="off" value="${esc(s.nixKey)}" onchange="S.settings.nixKey=this.value.trim();save();toast('Saved')"></label></div>
 <div class="card"><h3>Food search</h3><p class="note">Common foods come from the USDA database; packaged foods and barcodes come from Open Food Facts. The shared USDA key allows about 30 searches an hour. A free personal key from api.data.gov raises that to 1,000, and also turns on search-as-you-type.</p>
  <label class="fld">USDA API key<input value="${esc(s.usdaKey)}" onchange="S.settings.usdaKey=this.value.trim()||'DEMO_KEY';save();toast('Key saved')"></label></div>
 <div class="card"><h3>Appearance</h3><div class="btnrow">${[['dark','Dark'],['light','Light'],['auto','Match phone']].map(([k,l])=>`<button class="chip ${s.theme===k?'on':''}" onclick="S.settings.theme='${k}';save();applyTheme();render()">${l}</button>`).join('')}</div></div>
 <div class="card"><h3>Your data</h3><p class="note">Data is saved on this phone. Export a backup now and then, or turn on Google Sheet sync.</p>
  <button class="ghost wide" onclick="exportCSV()">Export diary (CSV)</button>
  <button class="ghost wide" onclick="exportBackup()">Download full backup</button>
  <label class="ghost wide" style="text-align:center;cursor:pointer">Restore from backup file<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)"></label>
  <button class="danger wide" onclick="if(confirm('Delete ALL data on this device? This can’t be undone.')){const u=S.settings.sheetUrl,ak=S.settings.aiKey,ni=S.settings.nixId,nk=S.settings.nixKey;S=defaults();S.settings.sheetUrl=u;S.settings.aiKey=ak;S.settings.nixId=ni;S.settings.nixKey=nk;save();setTab('today')}">Delete all data</button></div>`};

/* ================= start ================= */
applyTheme();render();
setInterval(()=>{const t=today();if(t!==render.lastDay){if(render.lastDay&&cur===render.lastDay){cur=t;if(stack[stack.length-1].v==='today')render()}render.lastDay=t}},60000);render.lastDay=today();
</script>
